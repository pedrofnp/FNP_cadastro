{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="container mt-4">
  <h3 class="mb-4">Município</h3>

  <div class="mb-4">
    <label for="municipio_id" class="form-label">Selecione o Município:</label>
    <select name="municipio_id" id="municipio_id" class="form-select">
      <option value="">-- Escolha --</option>
      {% for municipio in municipios %}
        <option value="{{ municipio.municipio|upper }}">{{ municipio.municipio|title }} - {{ municipio.uf }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- Mapa -->
  <div id="mapa" class="mb-3 rounded shadow" style="height: 400px;"></div>

  <!-- Status de adimplência -->
  <div id="status_adimplencia" class="h5 text-center mb-3"></div>

  <!-- Dados -->
  <div id="dados_municipio" class="border p-3 rounded bg-light" style="display: none;">
    <div id="dados_exibicao">
      <p><strong>Município:</strong> <span id="info_nome"></span></p>
      <p><strong>UF:</strong> <span id="info_uf"></span></p>
      <p><strong>População:</strong> <span id="info_populacao"></span></p>
      <p><strong>Participação:</strong> <span id="info_participacao"></span></p>
      <button id="btn_editar" class="btn btn-primary mt-2">Editar</button>
    </div>

    <!-- Form de edição -->
    <form id="form_edicao" method="post" action="{% url 'editar_municipio_ajax' %}" style="display:none;" class="mt-3">
      {% csrf_token %}
      <input type="hidden" name="municipio" id="form_municipio">

      <div class="mb-3">
        <label for="projeto_select" class="form-label">Adicionar Categoria:</label>
        <div class="input-group">
          <select id="projeto_select" class="form-select">
            <option value="Cultura">Cultura</option>
            <option value="Saúde">Saúde</option>
            <option value="Mobilidade">Mobilidade</option>
            <option value="Dados">Dados</option>
            <option value="Internacional">Internacional</option>
            <option value="Esporte">Esporte</option>
            <option value="Educação">Educação</option>
            <option value="Segurança">Segurança</option>
          </select>
          <button type="button" id="btn_add_projeto" class="btn btn-success">Adicionar</button>
        </div>
      </div>

      <div id="lista_participacao" class="mb-3"></div>

      <button type="submit" class="btn btn-success">Salvar Alterações</button>
      <button type="button" id="btn_cancelar" class="btn btn-secondary">Cancelar</button>
    </form>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="{% static 'js/mapa_municipio.js' %}"></script>

{% endblock %}
